spring.application.name=demo
server.port=${PORT:8080}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Local database (default profile) — fixed H2 settings, not overridden by env vars.
# AUTO_SERVER=TRUE allows a second process (e.g. IDE + mvn) to share the file DB.
spring.datasource.url=jdbc:h2:file:./data/demodb;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Production Postgres (Render, etc.): set SPRING_PROFILES_ACTIVE=postgres and:
#   JDBC_DATABASE_URL=jdbc:postgresql://host:5432/dbname
#   JDBC_DATABASE_USERNAME=...
#   JDBC_DATABASE_PASSWORD=...
