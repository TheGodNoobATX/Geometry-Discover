<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="site-nav" th:fragment="navbar">
    <a class="site-nav-brand" th:href="@{/home}">
        <span class="site-nav-brand-main">GD</span>
        <span class="site-nav-brand-sub">DISCOVER</span>
    </a>

    <div class="site-nav-links">
        <a th:href="@{/home}">Home</a>
        <a th:href="@{/search}">Search</a>
        <a th:if="${isAuthenticated}" th:href="@{/profile}">Profile</a>
        <a th:if="${isAuthenticated}" th:href="@{/account}">Account</a>
    </div>

    <div class="site-nav-user">
        <th:block th:if="${isAuthenticated}">
            <a class="site-nav-user-link" th:href="@{/profile}" th:title="'View ' + ${currentUser} + ' profile'">
                <span class="site-nav-user-label">Logged in as</span>
                <span class="site-nav-username" th:text="${currentUser}">player</span>
                <span th:if="${currentUserIsAdmin}" class="admin-badge">ADMIN</span>
            </a>
            <form th:action="@{/logout}" method="post" class="site-nav-logout">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="site-nav-button">Log out</button>
            </form>
        </th:block>

        <th:block th:unless="${isAuthenticated}">
            <a class="site-nav-button" th:href="@{/login}">Sign in</a>
            <a class="site-nav-button site-nav-button-primary" th:href="@{/register}">Register</a>
        </th:block>
    </div>
</nav>
</body>
</html>
