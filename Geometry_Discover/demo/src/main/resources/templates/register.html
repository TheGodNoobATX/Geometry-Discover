<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Register - Geometry Discover</title>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="auth-page">
        <section class="auth-card">
            <p class="profile-eyebrow">CREATE ACCOUNT</p>
            <h1 class="auth-title">Join the community!</h1>
            <p class="auth-subtitle">Rate levels, leave comments, and show other people what you think.</p>

            <div th:if="${error}" class="auth-alert auth-alert-error" th:text="${error}"></div>

            <form method="post" th:action="@{/register}" class="auth-form">
                <label class="auth-label" for="reg-username">Username</label>
                <input id="reg-username" class="auth-input" type="text" name="username"
                       autocomplete="username" th:value="${formUsername}" required autofocus />

                <label class="auth-label" for="reg-email">Email</label>
                <input id="reg-email" class="auth-input" type="email" name="email"
                       autocomplete="email" th:value="${formEmail}" required />

                <label class="auth-label" for="reg-password">Password</label>
                <input id="reg-password" class="auth-input" type="password" name="password"
                       autocomplete="new-password" required />

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button class="gd-button-green gd-button-sm auth-submit" type="submit">CREATE ACCOUNT</button>
            </form>

            <p class="auth-secondary">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </p>
        </section>
    </main>
</body>
</html>
