<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Geometry Discover</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .register-container { max-width: 360px; margin: 60px auto; padding: 24px; border: 1px solid #ddd; border-radius:8px; }
        .register-input { display:block; width:100%; padding:8px; margin:8px 0; box-sizing: border-box; }
        .register-button { display:inline-block; padding:8px 16px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-right: 8px; }
        .register-button:hover { background:#0056b3; }
        .message { color:green; padding: 8px; margin-bottom: 12px; }
        .error { color:red; padding: 8px; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>Create an Account</h2>

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${success}" class="message" th:text="${success}"></div>

    <form method="post" th:action="@{/register}">
        <input class="register-input" type="text" name="username" placeholder="Username" required autofocus />
        <input class="register-input" type="email" name="email" placeholder="Email" required />
        <input class="register-input" type="password" name="password" placeholder="Password" required />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button class="register-button" type="submit">Create Account</button>
    </form>

    <p style="margin-top:12px;"><a th:href="@{/login}">Already have an account? Login here</a></p>
    <p><a th:href="@{/}">Back to home</a></p>
</div>

</body>
</html>
