<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Sign in - Geometry Discover</title>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>

    <main class="auth-page">
        <section class="auth-card">
            <p class="profile-eyebrow">SIGN IN</p>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Log in to rate levels, leave comments, and pin your favorite.</p>

            <div th:if="${param.error}" class="auth-alert auth-alert-error">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="auth-alert auth-alert-success">
                You have been logged out.
            </div>
            <div th:if="${flashSuccess}" class="auth-alert auth-alert-success" th:text="${flashSuccess}"></div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <label class="auth-label" for="auth-username">Username</label>
                <input id="auth-username" class="auth-input" type="text" name="username"
                       autocomplete="username" autofocus required />

                <label class="auth-label" for="auth-password">Password</label>
                <input id="auth-password" class="auth-input" type="password" name="password"
                       autocomplete="current-password" required />

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <button class="gd-button-green gd-button-sm auth-submit" type="submit">SIGN IN</button>
            </form>

            <p class="auth-secondary">
                Don't have an account?
                <a th:href="@{/register}">Create one</a>
            </p>
        </section>
    </main>
</body>
</html>
