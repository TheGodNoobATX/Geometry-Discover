<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Geometry Discover</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .login-container { max-width: 360px; margin: 60px auto; padding: 24px; border: 1px solid #ddd; border-radius:8px; }
        .login-input { display:block; width:100%; padding:8px; margin:8px 0; }
        .login-button { display:inline-block; padding:8px 16px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer; }
        .message { color:green; }
        .error { color:red; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <div th:if="${param.error}" class="error">Invalid username or password.</div>
    <div th:if="${param.logout}" class="message">You have been logged out.</div>

    <form th:action="@{/login}" method="post">
        <input class="login-input" type="text" name="username" placeholder="Username" autofocus />
        <input class="login-input" type="password" name="password" placeholder="Password" />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button class="login-button" type="submit">Sign in</button>
    </form>

    <p style="margin-top:12px;"><a th:href="@{/register}">Create an Account</a></p>
    <p><a th:href="@{/}">Back to home</a></p>

    <p style="margin-top:12px;"><a th:href="@{/}">Back to home</a></p>
</div>

</body>
</html>
