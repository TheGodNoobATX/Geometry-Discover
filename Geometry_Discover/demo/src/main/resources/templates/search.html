<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Geometry Discover</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="search-page-container">
        <div class="search-controls">
            <input type="text" id="searchInput" placeholder="Search by name or creator...">
            <select id="difficultyFilter">
                <option value="">All Difficulties</option>
                <option value="Auto">Auto</option>
                <option value="Easy">Easy</option>
                <option value="Normal">Normal</option>
                <option value="Hard">Hard</option>
                <option value="Harder">Harder</option>
                <option value="Insane">Insane</option>
                <option value="Easy Demon">Easy Demon</option>
                <option value="Medium Demon">Medium Demon</option>
                <option value="Hard Demon">Hard Demon</option>
                <option value="Insane Demon">Insane Demon</option>
                <option value="Extreme Demon">Extreme Demon</option>
                <option value="Unverified">Unverified</option>
                <option value="Unstable">Unstable</option>
            </select>
            <select id="sortSelect">
                <option value="name">Sort by Name (A-Z)</option>
                <option value="difficulty">Sort by Difficulty</option>
                <option value="creator">Sort by Creator</option>
                <option value="rating">Sort by Rating (High-Low)</option>
            </select>
            <button class="gd-button-green gd-search-button" id="clearBtn">Clear Filters</button>
        </div>
        <div class="Levels">
            <div id="levels-container">
            <!-- Dynamic levels will be inserted here by JavaScript -->
            </div>
        </div>
    </div>

            {name: 'The Yatagarasu', creator: 'Manix648', difficulty: 'High-Peak Hard Demon', image: 'The Yatagarasu.jpg'},
            {name: 'Future Funk II', creator: 'JonathanGD', difficulty: 'Mid-High Insane Demon', image: 'Future Funk II.jpg'},
            {name: 'Space Invaders', creator: 'DeeperSpace', difficulty: 'Low-Mid Hard Demon', image: 'Space Invaders.jpg'},
            {name: 'CICADA3302', creator: 'Darwin', difficulty: 'Mid-High Extreme Demon', image: 'CICADA3302.jpg'},
            {name: 'WANNACRY', creator: 'kira9999', difficulty: 'Mid-High Medium Demon', image: 'WANNACRY.jpg'},
            {name: 'Tornado', creator: 'AbstractDark', difficulty: 'Platformer Low-Mid Harder', image: 'Tornado.jpg'},
            {name: 'Unknown Seas', creator: 'CapaXL', difficulty: 'Peak Normal', image: 'Unknown Seas.jpg'},
            {name: 'Rage Quit', creator: 'Bli', difficulty: 'High Easy', image: 'Rage Quit.jpg'},
            {name: 'Bloodlust', creator: 'Knobbelboy', difficulty: 'High Extreme Demon', image: 'Bloodlust.jpg'},
            {name: 'End of line', creator: 'PMK', difficulty: 'Mid-High Normal', image: 'End of line.jpg'},
            {name: 'Auto Play Area', creator: 'Jax', difficulty: 'Auto', image: 'Auto Play Area.jpg'},
            {name: 'Anubis', creator: 'Adiale', difficulty: 'Mid Hard', image: 'Anubis.jpg'},
            {name: 'Game Over', creator: 'Optation', difficulty: 'High-Peak Easy Demon', image: 'Game Over.jpg'},
            {name: 'Stereo Madness', creator: 'RobTop', difficulty: 'Peak Easy', image: 'Stereo Madness.jpg'},
            {name: 'Back On Track', creator: 'RobTop', difficulty: 'Peak Easy', image: 'Back On Track.jpg'},
            {name: 'Polargeist', creator: 'RobTop', difficulty: 'Mid-High Normal', image: 'Polargeist.jpg'},
            {name: 'Dry Out', creator: 'RobTop', difficulty: 'High Normal', image: 'Dry Out.jpg'},
            {name: 'Base After Base', creator: 'RobTop', difficulty: 'Mid Hard', image: 'Base After Base.jpg'},
            {name: 'Cant Let Go', creator: 'RobTop', difficulty: 'Peak Hard', image: 'Cant Let Go.jpg'}
        ];

        const PLAYER_ID_STORAGE_KEY = 'gd-player-id-v1';

        const canonicalDifficulties = [
            'Auto', 'Easy', 'Normal', 'Hard', 'Harder', 'Insane',
            'Easy Demon', 'Medium Demon', 'Hard Demon', 'Insane Demon', 'Extreme Demon',
            'Unverified', 'Unstable'
        ];

        function toLevelKey(level) {
            return `${level.name}__${level.creator}`
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
        }

        function getOrCreatePlayerId() {
            const existing = localStorage.getItem(PLAYER_ID_STORAGE_KEY);
            if (existing) return existing;
            const created = `player-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
            localStorage.setItem(PLAYER_ID_STORAGE_KEY, created);
            return created;
        }

        const playerId = getOrCreatePlayerId();
        let feedbackByLevel = {};

        function getLevelRatingStat(level) {
            const key = toLevelKey(level);
            const summary = feedbackByLevel[key] || {};
            const average = Number(summary.average || 0);
            const count = Number(summary.count || 0);
            const playerRating = Number.isInteger(summary.playerRating) ? summary.playerRating : 0;
            const playerComment = summary.playerComment || '';
            const comments = Array.isArray(summary.comments) ? summary.comments : [];
            return { key, average, count, playerRating, playerComment, comments };
        }

        async function refreshFeedbackData() {
            const params = new URLSearchParams();
            params.set('playerId', playerId);
            levels.forEach((level) => params.append('levelKeys', toLevelKey(level)));

            const response = await fetch(`/api/level-feedback?${params.toString()}`);
            if (!response.ok) {
                throw new Error('Failed to load level feedback.');
            }
            feedbackByLevel = await response.json();
        }

        function getPresetFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('preset') || '';
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function submitLevelRating(levelKey, stars) {
            if (!Number.isInteger(stars) || stars < 1 || stars > 5) return;

            const response = await fetch(`/api/level-feedback/${encodeURIComponent(levelKey)}/rating`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerId, rating: stars })
            });
            if (!response.ok) {
                alert('Unable to save rating right now. Please try again.');
                return;
            }
            feedbackByLevel[levelKey] = await response.json();
            applyFilters();
        }

        async function submitLevelComment(levelKey, commentText) {
            const trimmedComment = (commentText || '').trim();

            if (!trimmedComment) {
                alert('Please enter a short comment before submitting.');
                return;
            }

            const response = await fetch(`/api/level-feedback/${encodeURIComponent(levelKey)}/comment`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playerId, comment: trimmedComment })
            });
            if (!response.ok) {
                alert('Submit a rating first, then save your comment.');
                return;
            }
            feedbackByLevel[levelKey] = await response.json();
            applyFilters();
        }

        function getCoreDifficulty(fullDiff) {
            if (!fullDiff) return '';
            let words = fullDiff.toLowerCase().replace(/-/g, ' ').split(/\s+/).filter(w => w);
            if (words[0] === 'platformer') words.shift();
            let core;
            const last = words[words.length - 1];
            if (last === 'demon') {
                core = words.slice(-2).join(' ');
            } else {
                core = last;
            }
            for (let diff of canonicalDifficulties) {
                if (core === diff.toLowerCase()) return diff;
            }
            return fullDiff; // fallback
        }

        function renderLevels(filteredLevels) {
            const container = document.getElementById('levels-container');
            container.innerHTML = '';

            filteredLevels.forEach((level, index) => {
                const rating = getLevelRatingStat(level);
                const roundedAverage = Math.round(rating.average);
                const playerRating = rating.playerRating || 0;
                const existingPlayerComment = rating.playerComment || '';
                const commentsForLevel = rating.comments || [];
                const levelDiv = document.createElement('div');
                levelDiv.className = 'Level';
                levelDiv.innerHTML = `
                    <div class="level-image-wrapper">
                        <img src="/images/${level.image}" alt="${level.name} preview" style="width:100%;height:100%;object-fit:cover;">
                    </div>
                    <div class="level-info">
                        <h3>${level.name}</h3>
                        <p>Creator: ${level.creator}</p>
                        <p>Difficulty: ${level.difficulty}</p>
                        <div class="level-rating">
                            <p class="rating-summary">Average: ${rating.average.toFixed(2)} / 5 (${rating.count} ratings)</p>
                            <p class="rating-summary">Your rating: ${playerRating ? `${playerRating} / 5` : 'Not rated yet'}</p>
                            <div class="star-rating">
                                ${[1, 2, 3, 4, 5].map((star) => `
                                    <button
                                        type="button"
                                        class="star-btn ${star <= roundedAverage ? 'filled' : ''} ${star <= playerRating ? 'player-selected' : ''}"
                                        data-level-key="${rating.key}"
                                        data-stars="${star}"
                                        aria-label="Rate ${level.name} ${star} out of 5 stars"
                                        title="Rate ${star} star${star > 1 ? 's' : ''}"
                                    >★</button>
                                `).join('')}
                            </div>
                            <div class="level-comment-composer">
                                <label for="comment-${rating.key}">Why this rating?</label>
                                <textarea id="comment-${rating.key}" class="level-comment-input" placeholder="Share what you liked or disliked...">${existingPlayerComment}</textarea>
                                <button type="button" class="gd-button-blue level-comment-btn" data-level-key="${rating.key}">
                                    Save Comment
                                </button>
                            </div>
                            <div class="level-comments-list">
                                ${commentsForLevel.length
                                    ? commentsForLevel.map((entry) => `
                                        <div class="level-comment-item ${entry.isPlayer ? 'is-player-comment' : ''}">
                                            <p class="comment-meta">${escapeHtml(entry.author || 'Player')} - ${Number(entry.rating || 0)}/5</p>
                                            <p class="comment-body">${escapeHtml(entry.comment || '')}</p>
                                        </div>
                                    `).join('')
                                    : '<p class="comment-empty">No comments yet.</p>'
                                }
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(levelDiv);
                
                if (index < filteredLevels.length - 1) {
                    const divider = document.createElement('div');
                    divider.className = 'level-divider';
                    container.appendChild(divider);
                }
            });

            document.querySelectorAll('.star-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const levelKey = button.dataset.levelKey;
                    const stars = Number(button.dataset.stars);
                    submitLevelRating(levelKey, stars);
                });
            });

            document.querySelectorAll('.level-comment-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const levelKey = button.dataset.levelKey;
                    const input = document.getElementById(`comment-${levelKey}`);
                    submitLevelComment(levelKey, input ? input.value : '');
                });
            });
        }

        function applyFilters() {
            let filtered = [...levels];
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const difficulty = document.getElementById('difficultyFilter').value;
            const sortBy = document.getElementById('sortSelect').value;
            const preset = getPresetFromUrl();

            if (searchTerm) {
                filtered = filtered.filter(level => 
                    level.name.toLowerCase().includes(searchTerm) || 
                    level.creator.toLowerCase().includes(searchTerm)
                );
            }

            if (difficulty) {
                filtered = filtered.filter(level => getCoreDifficulty(level.difficulty) === difficulty);
            }

            filtered.sort((a, b) => {
                if (preset === 'recently-added') {
                    // Show all levels by add order, newest first.
                    return levels.indexOf(b) - levels.indexOf(a);
                } else if (sortBy === 'difficulty') {
                    const coreA = getCoreDifficulty(a.difficulty);
                    const coreB = getCoreDifficulty(b.difficulty);
                    const indexA = canonicalDifficulties.indexOf(coreA);
                    const indexB = canonicalDifficulties.indexOf(coreB);
                    return (indexA === -1 ? Infinity : indexA) - (indexB === -1 ? Infinity : indexB);
                } else if (sortBy === 'rating') {
                    const ratingA = getLevelRatingStat(a);
                    const ratingB = getLevelRatingStat(b);

                    // Put rated levels first; unrated levels at the bottom.
                    if (ratingA.count === 0 && ratingB.count > 0) return 1;
                    if (ratingB.count === 0 && ratingA.count > 0) return -1;

                    // Higher average rating first.
                    if (ratingB.average !== ratingA.average) {
                        return ratingB.average - ratingA.average;
                    }

                    // Tie-breaker: more ratings first, then name.
                    if (ratingB.count !== ratingA.count) {
                        return ratingB.count - ratingA.count;
                    }
                    return a.name.localeCompare(b.name);
                } else {
                    let valA = sortBy === 'creator' ? a.creator : a.name;
                    let valB = sortBy === 'creator' ? b.creator : b.name;
                    return valA.localeCompare(valB);
                }
            });

            renderLevels(filtered);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const preset = getPresetFromUrl();
            if (preset === 'top-rated') {
                document.getElementById('sortSelect').value = 'rating';
            }

            try {
                await refreshFeedbackData();
            } catch (err) {
                console.error(err);
            }

            applyFilters();

            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('difficultyFilter').addEventListener('change', applyFilters);
            document.getElementById('sortSelect').addEventListener('change', applyFilters);
            document.getElementById('clearBtn').addEventListener('click', () => {
                document.getElementById('searchInput').value = '';
                document.getElementById('difficultyFilter').value = '';
                document.getElementById('sortSelect').value = 'name';
                applyFilters();
            });
        });
    </script>
